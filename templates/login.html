<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Studio — Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050507;
            --bg-deep: #0a0a0f;
            --bg-card: rgba(15, 15, 22, 0.8);
            --bg-input: rgba(20, 20, 30, 0.9);
            --border-dim: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-bright: #f8fafc;
            --text-soft: #94a3b8;
            --text-dim: #475569;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-tertiary: #06b6d4;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.2);
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--bg-void);
            color: var(--text-bright);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated mesh gradient background */
        .mesh-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .mesh-gradient::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
            animation: meshMove 20s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(3deg); }
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-primary);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-secondary);
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: var(--accent-tertiary);
            top: 40%;
            right: 20%;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Noise texture overlay */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Scan line effect */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        /* Main container */
        .portal-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        /* Card with glassmorphism */
        .portal-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                0 0 100px -20px rgba(99, 102, 241, 0.15);
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(99, 102, 241, 0.5) 20%,
                rgba(168, 85, 247, 0.5) 50%,
                rgba(6, 182, 212, 0.5) 80%,
                transparent 100%
            );
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Brand header */
        .brand {
            text-align: center;
            margin-bottom: 44px;
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            position: relative;
        }

        .brand-icon-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transform: rotate(-6deg);
            transition: transform 0.3s ease;
        }

        .brand-icon:hover .brand-icon-inner {
            transform: rotate(0deg) scale(1.05);
        }

        .brand-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 24px;
            z-index: -1;
            opacity: 0.3;
            filter: blur(16px);
        }

        .brand-icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-bright) 0%, var(--text-soft) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Form styling */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-soft);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 2px;
        }

        .input-container {
            position: relative;
        }

        .input-glow {
            position: absolute;
            inset: -1px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .input-container:focus-within .input-glow {
            opacity: 1;
        }

        .input-wrapper {
            position: relative;
            z-index: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-dim);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .input-container:focus-within .input-wrapper {
            border-color: transparent;
            background: var(--bg-deep);
        }

        .form-input {
            width: 100%;
            padding: 16px 18px 16px 52px;
            background: transparent;
            border: none;
            color: var(--text-bright);
            font-family: inherit;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .form-input:focus {
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-dim);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-dim);
            transition: color 0.3s ease;
            z-index: 2;
        }

        .input-container:focus-within .input-icon {
            color: var(--accent-primary);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: var(--text-soft);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* Submit button */
        .btn-submit {
            position: relative;
            width: 100%;
            padding: 18px 28px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            z-index: -1;
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .btn-submit:hover::before {
            opacity: 1;
        }

        .btn-submit:hover::after {
            opacity: 0.5;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-text svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .btn-submit:hover .btn-text svg {
            transform: translateX(4px);
        }

        /* Loading spinner */
        .btn-submit.loading .btn-text {
            opacity: 0;
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            opacity: 0;
        }

        .btn-submit.loading .spinner {
            opacity: 1;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Error message */
        .error-alert {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            background: var(--error-glow);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 12px;
            font-size: 14px;
            color: var(--error);
            animation: errorShake 0.5s ease;
        }

        .error-alert.visible {
            display: flex;
        }

        .error-alert svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-4px); }
            30%, 70% { transform: translateX(4px); }
        }

        /* Footer */
        .portal-footer {
            margin-top: 36px;
            text-align: center;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            font-size: 12px;
            color: var(--success);
            font-weight: 500;
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
        }

        /* Bottom branding */
        .bottom-brand {
            margin-top: 32px;
            text-align: center;
        }

        .bottom-brand p {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-dim);
            opacity: 0.6;
        }

        .kbd {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .portal-card {
                padding: 36px 28px;
                border-radius: 20px;
            }

            .brand-icon {
                width: 60px;
                height: 60px;
            }

            .brand-title {
                font-size: 24px;
            }

            .keyboard-hint {
                display: none;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background effects -->
    <div class="mesh-gradient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="noise"></div>
    <div class="scanlines"></div>

    <!-- Main portal -->
    <div class="portal-container">
        <div class="portal-card">
            <div class="brand">
                <div class="brand-icon">
                    <div class="brand-icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                            <polyline points="2 17 12 22 22 17"/>
                            <polyline points="2 12 12 17 22 12"/>
                        </svg>
                    </div>
                </div>
                <h1 class="brand-title">LIVE Weekly Studio</h1>
            </div>

            <form class="login-form" method="POST" action="/login" id="loginForm">
                <div class="error-alert {% if error %}visible{% endif %}" id="errorAlert">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="errorText">{{ error or 'Invalid credentials. Please try again.' }}</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-container">
                        <div class="input-glow"></div>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                class="form-input" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                                autofocus
                            >
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-container">
                        <div class="input-glow"></div>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                class="form-input" 
                                id="password" 
                                name="password" 
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <button type="button" class="password-toggle" id="togglePassword" tabindex="-1">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">
                        Access Portal
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="portal-footer">
                <div class="security-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Encrypted Session
                </div>
            </div>
        </div>

        <div class="bottom-brand">
            <p>INTERNAL ACCESS ONLY</p>
        </div>
    </div>

    <div class="keyboard-hint">
        Press <span class="kbd">Enter</span> to submit
    </div>

    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            eyeIcon.innerHTML = isPassword 
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        // Form submission
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', () => {
            submitBtn.classList.add('loading');
        });

        // Smooth focus transitions
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.input-container').classList.add('focused');
            });
            input.addEventListener('blur', () => {
                input.closest('.input-container').classList.remove('focused');
            });
        });
    </script>
</body>
</html>
